# 构建机内存有限：限制 Gradle/Kotlin 堆与并行度
org.gradle.jvmargs=-Xmx1408m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx1024m

android.useAndroidX=true
android.enableJetifier=false

# 抑制 compileSdk 37 的兼容性警告（AGP 9.2.1 已支持 API 37，保留以消除告警噪音）
android.suppressUnsupportedCompileSdk=37,37.0

# 严禁加入 android.uniquePackageNames=false：
# 该配置会打乱 AAR 编译资源的包名解析，导致 aapt2 链接时库属性（appcompat/material 等）全部找不到。
