name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建并发布 APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 准备 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 安装 Android SDK 组件
        run: |
          set -euo pipefail
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMAN" ]; then
            SDKMAN="$(command -v sdkmanager)"
          fi
          yes | "$SDKMAN" --licenses > /dev/null 2>&1 || true
          # API 37 平台在 SDK 仓库中按 android-37.0 提供，个别版本为 android-37，两者都试
          "$SDKMAN" "platform-tools" "build-tools;37.0.0" "platforms;android-37.0" \
            || "$SDKMAN" "platform-tools" "build-tools;37.0.0" "platforms;android-37"

          # AGP 按 compileSdk=37 查找 platforms/android-37 并按 ApiLevel 元数据校验，
          # 与本地工具链保持一致：缺目录时从 android-37.0 复制并改写 ApiLevel。
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            cp -r "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
            sed -i 's/^AndroidVersion\.ApiLevel=.*/AndroidVersion.ApiLevel=37/' \
              "$ANDROID_HOME/platforms/android-37/source.properties"
          fi
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: 准备签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            mkdir -p keystore
            printf '%s' "$KEYSTORE_B64" | base64 -d > keystore/anrdp-release.jks
            {
              echo "storeFile=keystore/anrdp-release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=anrdp"
              echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } > keystore.properties
            echo "已注入专用 release 签名密钥"
          else
            echo "::warning::未配置 KEYSTORE_B64，本次回退 debug 签名；产物无法覆盖安装本机 release 包"
          fi

      - name: 构建 release APK
        run: |
          set -euo pipefail
          # 仓库从 Windows 侧提交，个别脚本可能带 CRLF，先归一化
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          # 本机 gradle.properties 为 8GB 小内存机器调优；CI 机器更宽裕，放宽限制
          ./gradlew :app:assembleRelease --console=plain \
            -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=4

      - name: 校验 APK 并整理产物
        id: artifact
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          [ -f "$APK" ] || { echo "未产出 $APK"; exit 1; }

          AAPT2="$ANDROID_HOME/build-tools/37.0.0/aapt2"
          PERMS="$("$AAPT2" dump permissions "$APK")"
          for p in CAMERA RECORD_AUDIO READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE POST_NOTIFICATIONS; do
            if grep -q "android.permission.$p'" <<<"$PERMS"; then
              echo "APK 仍包含未使用权限：$p"; exit 1
            fi
          done
          for p in INTERNET ACCESS_NETWORK_STATE; do
            grep -q "android.permission.$p'" <<<"$PERMS" || { echo "APK 缺少必需权限：$p"; exit 1; }
          done
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libfreerdp-android\.so' || { echo "APK 缺少引擎原生库"; exit 1; }

          NAME="AnRDP-${GITHUB_REF_NAME}-arm64-v8a.apk"
          mkdir -p dist
          cp "$APK" "dist/$NAME"
          ( cd dist && sha256sum "$NAME" > "$NAME.sha256" )
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: 上传构建产物（工作流附件）
        uses: actions/upload-artifact@v4
        with:
          name: anrdp-apk
          path: dist/*
          if-no-files-found: error

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: AnRDP ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/${{ steps.artifact.outputs.name }}
            dist/${{ steps.artifact.outputs.name }}.sha256
          fail_on_unmatched_files: true
